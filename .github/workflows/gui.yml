name: GUI

on:
  pull_request:

jobs:
  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: npm run test:gui
      - run: npm --prefix gui run typecheck
      - run: npm --prefix gui run build
