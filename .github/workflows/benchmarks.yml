name: Deterministic benchmarks

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run bench:deterministic
      - run: npm run bench:guard
      # The end-to-end arm (`node bench/run.mjs context-planner`) is deliberately
      # absent. It needs a live kind cluster and real paid model usage, so it
      # stays a deliberate human act — see bench/README.md.
